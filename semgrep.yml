rules:
  - id: detect-nosql-injection-where
    message: "Potential NoSQL injection: user-controlled input is used inside a MongoDB $where expression."
    severity: ERROR
    languages:
      - javascript
    patterns:
      - pattern: |
          {
            $where: `...${threshold}...`
          }
      
  - id: detect-eval-injection
    message: "Potential code injection: user-controlled input is passed to eval()."
    severity: ERROR
    languages:
      - javascript
    patterns:
      - pattern: eval($INPUT)